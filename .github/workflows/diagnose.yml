name: Diagnose DeckCraft iPad problems

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Download all code the app depends on
        run: cargo fetch --target aarch64-apple-ios

      - name: A - winit iPad view.rs (imports and keyboard part)
        run: |
          W=$(ls -d ~/.cargo/git/checkouts/winit-*/*/ | head -1)
          echo "=== lines 1-60 ==="
          sed -n '1,60p' "$W/src/platform_impl/ios/view.rs"
          echo "=== lines 320-375 ==="
          sed -n '320,375p' "$W/src/platform_impl/ios/view.rs"

      - name: B - winit iPad view.rs (touch and position code)
        run: |
          W=$(ls -d ~/.cargo/git/checkouts/winit-*/*/ | head -1)
          sed -n '440,640p' "$W/src/platform_impl/ios/view.rs"

      - name: C - winit iPad window.rs (window size code)
        run: |
          W=$(ls -d ~/.cargo/git/checkouts/winit-*/*/ | head -1)
          sed -n '495,545p' "$W/src/platform_impl/ios/window.rs"

      - name: D - winit dependencies
        run: |
          W=$(ls -d ~/.cargo/git/checkouts/winit-*/*/ | head -1)
          grep -n -i -E "objc2|icrate|ios|^version" "$W/Cargo.toml" | head -60

      - name: E - how this repo pins winit and eframe
        run: |
          grep -n -B2 -A6 -E "winit|eframe|\[patch" Cargo.toml || true
          echo "=== apps/deckcraft/Cargo.toml ==="
          cat apps/deckcraft/Cargo.toml

      - name: F - egui-winit keyboard, modifier and pointer handling
        run: |
          E=$(ls -d ~/.cargo/git/checkouts/egui-*/*/ | head -1)
          grep -n -E "ModifiersChanged|KeyboardInput|safe_area|fn take_egui_input|fn on_window_event|Touch|CursorMoved|pixels_per_point" "$E/crates/egui-winit/src/lib.rs" | head -100

      - name: G - DeckCraft window setup
        run: sed -n '225,335p' apps/deckcraft/src/main.rs

      - name: H - DeckCraft title bar
        run: head -120 crates/ui-egui/src/ribbon/title_bar.rs
