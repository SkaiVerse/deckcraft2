name: Diagnose DeckCraft iPad problems

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Download all code the app depends on
        run: cargo fetch --target aarch64-apple-ios

      - name: 1 - Where winit and eframe come from
        run: |
          grep -B1 -A4 'name = "winit"' Cargo.lock || true
          grep -B1 -A4 'name = "eframe"' Cargo.lock || true
          ls ~/.cargo/git/checkouts/ || true

      - name: 2 - winit iPad keyboard code
        run: |
          for F in ~/.cargo/git/checkouts/winit-*/*/src/platform_impl/ios; do
            echo "folder: $F"
            ls "$F" || true
            grep -n -E "pressesBegan|pressesEnded|UIPress|KeyboardInput|insertText|deleteBackward|modifier" "$F"/*.rs | head -60 || true
          done

      - name: 3 - winit iPad touch and position handling
        run: |
          for F in ~/.cargo/git/checkouts/winit-*/*/src/platform_impl/ios; do
            echo "folder: $F"
            grep -n -E "touchesBegan|touchesMoved|locationInView|location_in_view|contentScaleFactor|scale_factor|hover|pointer|UITouchType|indirect" "$F/view.rs" | head -80 || true
            echo "--- touch handler code ---"
            grep -n -A45 "fn handle_touch" "$F/view.rs" | head -150 || true
          done

      - name: 4 - winit iPad window size and safe area
        run: |
          for F in ~/.cargo/git/checkouts/winit-*/*/src/platform_impl/ios; do
            echo "folder: $F"
            grep -n -E "inner_size|bounds|frame\(|safe" "$F/window.rs" | head -40 || true
            grep -n -E "safe|bounds|frame\(" "$F/view.rs" | head -40 || true
          done

      - name: 5 - safe area handling in winit and egui (outside tests)
        run: |
          grep -rn -i -E "safe_area|safeArea" ~/.cargo/git/checkouts/winit-*/*/src ~/.cargo/git/checkouts/egui-*/*/crates --include=*.rs | grep -v "raw_input.rs" | head -60 || true

      - name: 6 - how the app draws its top bar and window
        run: |
          grep -rn -i -E "TopBottomPanel|menu_bar|title_bar|titlebar|ViewportCommand|with_decorations|with_fullsize_content_view" apps crates --include=*.rs | grep -v -E "tests?\.rs|_tests\.rs" | head -60 || true
