name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get fonts (optional, may be skipped)
        continue-on-error: true
        run: git clone --depth 1 https://github.com/storytold/craft-fonts ../craft-fonts

      - name: Install Rust for iPad and iPhone
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Remove Linux-only window code (not needed on iPad)
        run: |
          find . -name Cargo.toml -not -path "./target/*" -print0 | xargs -0 perl -0pi -e 's/"(wayland|x11)"\s*,?\s*//g'
          echo "--- anything left mentioning wayland or x11 ---"
          grep -rn --include=Cargo.toml -E "wayland|x11" . || true

      - name: Create iPad file dialog replacement (picker version and simple version)
        run: |
          mkdir -p "$HOME/rfd-picker/src" "$HOME/rfd-simple/src"
          cat > "$HOME/rfd-picker/Cargo.toml" <<'EOF'
          [package]
          name = "rfd"
          version = "0.17.2"
          edition = "2021"
          description = "iPad replacement for the file dialog library"

          [features]
          default = ["picker"]
          picker = ["dep:objc2"]
          xdg-portal = []
          gtk3 = []
          tokio = []
          async-std = []
          common-controls-v6 = []
          file-handle-inner = []

          [dependencies]
          objc2 = { version = "0.5.2", optional = true }
          EOF
          sed 's/default = \["picker"\]/default = []/' "$HOME/rfd-picker/Cargo.toml" > "$HOME/rfd-simple/Cargo.toml"
          cat > "$HOME/rfd-picker/src/lib.rs" <<'EOF'
          //! iPad replacement for the rfd crate.
          //! Picker version: opens the Files app picker (pick, then tap Open or Save again).
          //! Simple version: uses the app Documents folder.
          #![allow(dead_code)]
          #![allow(unused_imports)]

          use std::future::Future;
          use std::path::{Path, PathBuf};

          fn docs_dir() -> PathBuf {
              let home = std::env::var("HOME").unwrap_or_else(|_| ".".to_string());
              let dir = PathBuf::from(home).join("Documents");
              let _ = std::fs::create_dir_all(&dir);
              dir
          }

          fn clean_exts(exts: &[String]) -> Vec<String> {
              exts.iter()
                  .map(|e| e.trim().trim_start_matches("*.").trim_start_matches('.').to_lowercase())
                  .filter(|e| !e.is_empty() && e != "*")
                  .collect()
          }

          fn newest_matching(exts: &[String]) -> Option<PathBuf> {
              let exts = clean_exts(exts);
              let mut best: Option<(std::time::SystemTime, PathBuf)> = None;
              let entries = std::fs::read_dir(docs_dir()).ok()?;
              for entry in entries.flatten() {
                  let path = entry.path();
                  if !path.is_file() {
                      continue;
                  }
                  let hidden = path
                      .file_name()
                      .map(|n| n.to_string_lossy().starts_with('.'))
                      .unwrap_or(false);
                  if hidden {
                      continue;
                  }
                  if !exts.is_empty() {
                      let ext = path
                          .extension()
                          .map(|e| e.to_string_lossy().to_lowercase())
                          .unwrap_or_default();
                      if !exts.contains(&ext) {
                          continue;
                      }
                  }
                  let modified = entry
                      .metadata()
                      .and_then(|m| m.modified())
                      .unwrap_or(std::time::UNIX_EPOCH);
                  let is_newer = match &best {
                      Some((t, _)) => modified > *t,
                      None => true,
                  };
                  if is_newer {
                      best = Some((modified, path));
                  }
              }
              best.map(|(_, p)| p)
          }

          fn save_name(name: &str, exts: &[String]) -> String {
              let exts = clean_exts(exts);
              let mut name = if name.trim().is_empty() {
                  "Untitled".to_string()
              } else {
                  name.trim().to_string()
              };
              if Path::new(&name).extension().is_none() {
                  if let Some(first) = exts.first() {
                      name = format!("{}.{}", name, first);
                  }
              }
              name
          }

          #[cfg(feature = "picker")]
          mod ios_picker {
              use objc2::declare::ClassBuilder;
              use objc2::runtime::{AnyClass, AnyObject, Sel};
              use objc2::{class, msg_send, sel};
              use std::ffi::{CStr, CString};
              use std::os::raw::c_char;
              use std::path::PathBuf;
              use std::sync::atomic::{AtomicBool, Ordering};
              use std::sync::{Mutex, OnceLock};

              pub static PENDING_FILE: Mutex<Option<PathBuf>> = Mutex::new(None);
              pub static PENDING_FOLDER: Mutex<Option<PathBuf>> = Mutex::new(None);
              static FOLDER_MODE: AtomicBool = AtomicBool::new(false);
              static DELEGATE: OnceLock<usize> = OnceLock::new();

              fn store(path: PathBuf) {
                  if FOLDER_MODE.load(Ordering::SeqCst) {
                      *PENDING_FOLDER.lock().unwrap() = Some(path);
                  } else {
                      *PENDING_FILE.lock().unwrap() = Some(path);
                  }
              }

              extern "C" fn did_pick(_this: &AnyObject, _cmd: Sel, _picker: *mut AnyObject, urls: *mut AnyObject) {
                  unsafe {
                      if urls.is_null() {
                          return;
                      }
                      let count: usize = msg_send![urls, count];
                      if count == 0 {
                          return;
                      }
                      let url: *mut AnyObject = msg_send![urls, objectAtIndex: 0usize];
                      if url.is_null() {
                          return;
                      }
                      let _started: bool = msg_send![url, startAccessingSecurityScopedResource];
                      let _kept: *mut AnyObject = msg_send![url, retain];
                      let path_obj: *mut AnyObject = msg_send![url, path];
                      if path_obj.is_null() {
                          return;
                      }
                      let utf8: *const c_char = msg_send![path_obj, UTF8String];
                      if utf8.is_null() {
                          return;
                      }
                      let path = CStr::from_ptr(utf8).to_string_lossy().into_owned();
                      store(PathBuf::from(path));
                  }
              }

              extern "C" fn cancelled(_this: &AnyObject, _cmd: Sel, _picker: *mut AnyObject) {}

              unsafe fn delegate() -> *mut AnyObject {
                  let addr = *DELEGATE.get_or_init(|| {
                      unsafe {
                          let mut builder = ClassBuilder::new("DeckCraftPickerDelegate", class!(NSObject))
                              .expect("picker delegate class");
                          builder.add_method(
                              sel!(documentPicker:didPickDocumentsAtURLs:),
                              did_pick as extern "C" fn(_, _, _, _),
                          );
                          builder.add_method(
                              sel!(documentPickerWasCancelled:),
                              cancelled as extern "C" fn(_, _, _),
                          );
                          let cls = builder.register();
                          let obj: *mut AnyObject = msg_send![cls, new];
                          obj as usize
                      }
                  });
                  addr as *mut AnyObject
              }

              unsafe fn nsstring(s: &str) -> *mut AnyObject {
                  let c = CString::new(s).unwrap();
                  msg_send![class!(NSString), stringWithUTF8String: c.as_ptr()]
              }

              unsafe fn top_view_controller() -> *mut AnyObject {
                  let app: *mut AnyObject = msg_send![class!(UIApplication), sharedApplication];
                  if app.is_null() {
                      return std::ptr::null_mut();
                  }
                  let windows: *mut AnyObject = msg_send![app, windows];
                  if windows.is_null() {
                      return std::ptr::null_mut();
                  }
                  let count: usize = msg_send![windows, count];
                  let mut root: *mut AnyObject = std::ptr::null_mut();
                  let mut first: *mut AnyObject = std::ptr::null_mut();
                  for i in 0..count {
                      let w: *mut AnyObject = msg_send![windows, objectAtIndex: i];
                      if w.is_null() {
                          continue;
                      }
                      let vc: *mut AnyObject = msg_send![w, rootViewController];
                      if vc.is_null() {
                          continue;
                      }
                      if first.is_null() {
                          first = vc;
                      }
                      let is_key: bool = msg_send![w, isKeyWindow];
                      if is_key {
                          root = vc;
                          break;
                      }
                  }
                  if root.is_null() {
                      root = first;
                  }
                  while !root.is_null() {
                      let presented: *mut AnyObject = msg_send![root, presentedViewController];
                      if presented.is_null() {
                          break;
                      }
                      root = presented;
                  }
                  root
              }

              unsafe fn make_picker(folder: bool) -> *mut AnyObject {
                  let ident = if folder { "public.folder" } else { "public.item" };
                  let ident_ns = nsstring(ident);
                  if let Some(utt) = AnyClass::get("UTType") {
                      let t: *mut AnyObject = msg_send![utt, typeWithIdentifier: ident_ns];
                      if !t.is_null() {
                          let arr: *mut AnyObject = msg_send![class!(NSArray), arrayWithObject: t];
                          let alloc: *mut AnyObject = msg_send![class!(UIDocumentPickerViewController), alloc];
                          let p: *mut AnyObject = msg_send![alloc, initForOpeningContentTypes: arr, asCopy: false];
                          if !p.is_null() {
                              return p;
                          }
                      }
                  }
                  let arr: *mut AnyObject = msg_send![class!(NSArray), arrayWithObject: ident_ns];
                  let alloc: *mut AnyObject = msg_send![class!(UIDocumentPickerViewController), alloc];
                  let ok: bool = msg_send![alloc, respondsToSelector: sel!(initWithDocumentTypes:inMode:)];
                  if !ok {
                      return std::ptr::null_mut();
                  }
                  msg_send![alloc, initWithDocumentTypes: arr, inMode: 1usize]
              }

              unsafe fn present(folder: bool) -> bool {
                  let is_main: bool = msg_send![class!(NSThread), isMainThread];
                  if !is_main {
                      return false;
                  }
                  let root = top_view_controller();
                  if root.is_null() {
                      return false;
                  }
                  let already: bool = msg_send![root, isKindOfClass: class!(UIDocumentPickerViewController)];
                  if already {
                      return false;
                  }
                  FOLDER_MODE.store(folder, Ordering::SeqCst);
                  let picker = make_picker(folder);
                  if picker.is_null() {
                      return false;
                  }
                  let del = delegate();
                  let _: () = msg_send![picker, setDelegate: del];
                  let _: () = msg_send![root, presentViewController: picker, animated: true, completion: std::ptr::null_mut::<AnyObject>()];
                  true
              }

              pub fn show_picker(folder: bool) {
                  let _ = unsafe { present(folder) };
              }
          }

          #[cfg(feature = "picker")]
          fn take_open(_exts: &[String]) -> Option<PathBuf> {
              if let Some(p) = ios_picker::PENDING_FILE.lock().unwrap().take() {
                  return Some(p);
              }
              ios_picker::show_picker(false);
              None
          }

          #[cfg(not(feature = "picker"))]
          fn take_open(exts: &[String]) -> Option<PathBuf> {
              newest_matching(exts)
          }

          #[cfg(feature = "picker")]
          fn take_folder() -> Option<PathBuf> {
              if let Some(p) = ios_picker::PENDING_FOLDER.lock().unwrap().take() {
                  return Some(p);
              }
              ios_picker::show_picker(true);
              None
          }

          #[cfg(not(feature = "picker"))]
          fn take_folder() -> Option<PathBuf> {
              Some(docs_dir())
          }

          fn take_save(name: &str, exts: &[String]) -> Option<PathBuf> {
              take_folder().map(|dir| dir.join(save_name(name, exts)))
          }

          #[derive(Default, Clone, Debug)]
          pub struct FileDialog {
              exts: Vec<String>,
              file_name: String,
          }

          impl FileDialog {
              pub fn new() -> Self { Self::default() }
              pub fn add_filter(mut self, _name: impl Into<String>, extensions: &[impl ToString]) -> Self {
                  self.exts.extend(extensions.iter().map(|e| e.to_string()));
                  self
              }
              pub fn set_directory<P: AsRef<Path>>(self, _path: P) -> Self { self }
              pub fn set_file_name(mut self, name: impl Into<String>) -> Self {
                  self.file_name = name.into();
                  self
              }
              pub fn set_title(self, _title: impl Into<String>) -> Self { self }
              pub fn set_can_create_directories(self, _value: bool) -> Self { self }
              pub fn set_parent<W: ?Sized>(self, _parent: &W) -> Self { self }
              pub fn pick_file(self) -> Option<PathBuf> { take_open(&self.exts) }
              pub fn pick_files(self) -> Option<Vec<PathBuf>> { take_open(&self.exts).map(|p| vec![p]) }
              pub fn pick_folder(self) -> Option<PathBuf> { take_folder() }
              pub fn pick_folders(self) -> Option<Vec<PathBuf>> { take_folder().map(|p| vec![p]) }
              pub fn save_file(self) -> Option<PathBuf> { take_save(&self.file_name, &self.exts) }
          }

          #[derive(Clone, Debug)]
          pub struct FileHandle(PathBuf);

          impl FileHandle {
              pub fn path(&self) -> &Path { &self.0 }
              pub fn file_name(&self) -> String {
                  self.0.file_name().map(|n| n.to_string_lossy().to_string()).unwrap_or_default()
              }
              pub async fn read(&self) -> Vec<u8> { std::fs::read(&self.0).unwrap_or_default() }
              pub async fn write(&self, data: &[u8]) -> std::io::Result<()> { std::fs::write(&self.0, data) }
          }

          impl From<PathBuf> for FileHandle {
              fn from(p: PathBuf) -> Self { FileHandle(p) }
          }

          impl From<FileHandle> for PathBuf {
              fn from(h: FileHandle) -> Self { h.0 }
          }

          #[derive(Default, Clone, Debug)]
          pub struct AsyncFileDialog {
              exts: Vec<String>,
              file_name: String,
          }

          impl AsyncFileDialog {
              pub fn new() -> Self { Self::default() }
              pub fn add_filter(mut self, _name: impl Into<String>, extensions: &[impl ToString]) -> Self {
                  self.exts.extend(extensions.iter().map(|e| e.to_string()));
                  self
              }
              pub fn set_directory<P: AsRef<Path>>(self, _path: P) -> Self { self }
              pub fn set_file_name(mut self, name: impl Into<String>) -> Self {
                  self.file_name = name.into();
                  self
              }
              pub fn set_title(self, _title: impl Into<String>) -> Self { self }
              pub fn set_can_create_directories(self, _value: bool) -> Self { self }
              pub fn set_parent<W: ?Sized>(self, _parent: &W) -> Self { self }
              pub fn pick_file(&self) -> impl Future<Output = Option<FileHandle>> {
                  let result = take_open(&self.exts).map(FileHandle::from);
                  async move { result }
              }
              pub fn pick_files(&self) -> impl Future<Output = Option<Vec<FileHandle>>> {
                  let result = take_open(&self.exts).map(|p| vec![FileHandle::from(p)]);
                  async move { result }
              }
              pub fn pick_folder(&self) -> impl Future<Output = Option<FileHandle>> {
                  let result = take_folder().map(FileHandle::from);
                  async move { result }
              }
              pub fn pick_folders(&self) -> impl Future<Output = Option<Vec<FileHandle>>> {
                  let result = take_folder().map(|p| vec![FileHandle::from(p)]);
                  async move { result }
              }
              pub fn save_file(&self) -> impl Future<Output = Option<FileHandle>> {
                  let result = take_save(&self.file_name, &self.exts).map(FileHandle::from);
                  async move { result }
              }
          }

          #[derive(Clone, Copy, Debug, PartialEq, Eq, Default)]
          pub enum MessageLevel { #[default] Info, Warning, Error }

          #[derive(Clone, Debug, PartialEq, Eq, Default)]
          pub enum MessageButtons {
              #[default]
              Ok,
              OkCancel,
              YesNo,
              YesNoCancel,
              OkCustom(String),
              OkCancelCustom(String, String),
              YesNoCancelCustom(String, String, String),
          }

          #[derive(Clone, Debug, PartialEq, Eq)]
          pub enum MessageDialogResult { Yes, No, Ok, Cancel, Custom(String) }

          fn default_answer(buttons: &MessageButtons) -> MessageDialogResult {
              match buttons {
                  MessageButtons::Ok | MessageButtons::OkCustom(_) => MessageDialogResult::Ok,
                  MessageButtons::YesNo => MessageDialogResult::No,
                  _ => MessageDialogResult::Cancel,
              }
          }

          #[derive(Default, Clone, Debug)]
          pub struct MessageDialog { buttons: MessageButtons }

          impl MessageDialog {
              pub fn new() -> Self { Self::default() }
              pub fn set_level(self, _level: MessageLevel) -> Self { self }
              pub fn set_title(self, _title: impl Into<String>) -> Self { self }
              pub fn set_description(self, _text: impl Into<String>) -> Self { self }
              pub fn set_buttons(mut self, buttons: MessageButtons) -> Self { self.buttons = buttons; self }
              pub fn set_parent<W: ?Sized>(self, _parent: &W) -> Self { self }
              pub fn show(self) -> MessageDialogResult { default_answer(&self.buttons) }
          }

          #[derive(Default, Clone, Debug)]
          pub struct AsyncMessageDialog { buttons: MessageButtons }

          impl AsyncMessageDialog {
              pub fn new() -> Self { Self::default() }
              pub fn set_level(self, _level: MessageLevel) -> Self { self }
              pub fn set_title(self, _title: impl Into<String>) -> Self { self }
              pub fn set_description(self, _text: impl Into<String>) -> Self { self }
              pub fn set_buttons(mut self, buttons: MessageButtons) -> Self { self.buttons = buttons; self }
              pub fn set_parent<W: ?Sized>(self, _parent: &W) -> Self { self }
              pub fn show(self) -> impl Future<Output = MessageDialogResult> {
                  let answer = default_answer(&self.buttons);
                  async move { answer }
              }
          }
          EOF
          cp "$HOME/rfd-picker/src/lib.rs" "$HOME/rfd-simple/src/lib.rs"

      - name: Patch DeckCraft for iPad (startup code, window size, title bar)
        run: |
          # remove Linux-only X11 startup lines and the fixed 1440x900 window size
          perl -ni -e 'print unless /EventLoopBuilderExtX11|\.with_x11\(\)|\.with_inner_size\(\[1440\.0, 900\.0\]\)/' apps/deckcraft/src/main.rs
          # use the roomier "integrated" title bar so the iPad window buttons do not cover the toolbar
          perl -pi -e 's/cfg!\(target_os = "macos"\)/cfg!(any(target_os = "macos", target_os = "ios"))/ if /integrated_titlebar/' apps/deckcraft/src/main.rs
          perl -pi -e 's/(const MAC_LIGHTS_LEFT: f32 = )9\.0;/${1}33.0;/' crates/ui-egui/src/ribbon/title_bar.rs
          echo "--- result in main.rs ---"
          grep -n -E "integrated_titlebar|with_inner_size|with_x11|EventLoopBuilderExtX11" apps/deckcraft/src/main.rs || true
          echo "--- result in title_bar.rs ---"
          grep -n "MAC_LIGHTS_LEFT: f32" crates/ui-egui/src/ribbon/title_bar.rs || true

      - name: Download all code the app depends on
        run: cargo fetch --target aarch64-apple-ios

      - name: Patch egui (refresh the screen-edge safe area on every frame)
        run: |
          E=$(ls -d ~/.cargo/git/checkouts/egui-*/*/ | head -1)
          F="${E}crates/egui-winit/src/lib.rs"
          echo "EGUI_WINIT_LIB=$F" >> "$GITHUB_ENV"
          [ -f "$F.orig" ] || cp "$F" "$F.orig"
          if grep -q "DECKCRAFT-IOS-PATCH" "$F"; then
            echo "already patched"
          else
            perl -0pi -e 's/(pub fn take_egui_input\(&mut self, window: &Window\) -> egui::RawInput \{)/$1\n        self.egui_input_mut().safe_area_insets = Some(safe_area::get_safe_area_insets()); \/\/ DECKCRAFT-IOS-PATCH/' "$F"
          fi
          grep -n -B1 -A1 "DECKCRAFT-IOS-PATCH" "$F" || echo "WARNING: safe-area patch anchor not found"

      - name: Back up winit view.rs
        run: |
          W=$(ls -d ~/.cargo/git/checkouts/winit-*/*/ | head -1)
          V="${W}src/platform_impl/ios/view.rs"
          echo "WINIT_VIEW=$V" >> "$GITHUB_ENV"
          [ -f "$V.orig" ] || cp "$V" "$V.orig"
          echo "--- does winit already define these? ---"
          grep -c "didMoveToWindow" "$V.orig" || true
          grep -c "willMoveToWindow" "$V.orig" || true

      - name: Write keyboard and right-click patch pieces
        run: |
          # piece 1: opening of the extra method block plus the hardware key methods
          cat > "$HOME/kbd_open.rs" <<'EOF'
          // DECKCRAFT-KBD-METHODS
              unsafe impl WinitView {
                  #[method(pressesBegan:withEvent:)]
                  fn deckcraft_presses_began(&self, presses: &objc2::runtime::AnyObject, event: Option<&objc2::runtime::AnyObject>) {
                      if !deckcraft_hardware_keys(self, presses, true) {
                          let _: () = unsafe { msg_send![super(self), pressesBegan: presses, withEvent: event] };
                      }
                  }

                  #[method(pressesEnded:withEvent:)]
                  fn deckcraft_presses_ended(&self, presses: &objc2::runtime::AnyObject, event: Option<&objc2::runtime::AnyObject>) {
                      let _ = deckcraft_hardware_keys(self, presses, false);
                      let _: () = unsafe { msg_send![super(self), pressesEnded: presses, withEvent: event] };
                  }

                  #[method(pressesCancelled:withEvent:)]
                  fn deckcraft_presses_cancelled(&self, presses: &objc2::runtime::AnyObject, event: Option<&objc2::runtime::AnyObject>) {
                      let _ = deckcraft_hardware_keys(self, presses, false);
                      let _: () = unsafe { msg_send![super(self), pressesCancelled: presses, withEvent: event] };
                  }
          EOF

          # piece 2: ask for keyboard focus when the view appears (only used if winit does not already)
          cat > "$HOME/kbd_didmove.rs" <<'EOF'

                  #[method(didMoveToWindow)]
                  fn deckcraft_did_move_to_window(&self) {
                      let _: () = unsafe { msg_send![super(self), didMoveToWindow] };
                      if self.window().is_some() {
                          let _: bool = unsafe { msg_send![self, becomeFirstResponder] };
                      }
                  }
          EOF

          # piece 3: right-click methods (only used if winit does not already define willMoveToWindow)
          cat > "$HOME/rc_methods.rs" <<'EOF'

                  #[method(willMoveToWindow:)]
                  fn deckcraft_will_move_to_window(&self, new_window: *mut objc2::runtime::AnyObject) {
                      let _: () = unsafe { msg_send![super(self), willMoveToWindow: new_window] };
                      if !new_window.is_null() {
                          deckcraft_attach_right_click(self);
                      }
                  }

                  #[method(deckcraftRightClick:)]
                  fn deckcraft_right_click(&self, recognizer: &UIGestureRecognizer) {
                      deckcraft_send_right_click(self, recognizer);
                  }
          EOF

          # piece 4: helper functions for the keyboard, added at the end of view.rs
          cat > "$HOME/kbd_helper.rs" <<'EOF'

          // DECKCRAFT-KBD-HELPER
          const DECKCRAFT_LETTERS: [KeyCode; 26] = [
              KeyCode::KeyA, KeyCode::KeyB, KeyCode::KeyC, KeyCode::KeyD, KeyCode::KeyE, KeyCode::KeyF,
              KeyCode::KeyG, KeyCode::KeyH, KeyCode::KeyI, KeyCode::KeyJ, KeyCode::KeyK, KeyCode::KeyL,
              KeyCode::KeyM, KeyCode::KeyN, KeyCode::KeyO, KeyCode::KeyP, KeyCode::KeyQ, KeyCode::KeyR,
              KeyCode::KeyS, KeyCode::KeyT, KeyCode::KeyU, KeyCode::KeyV, KeyCode::KeyW, KeyCode::KeyX,
              KeyCode::KeyY, KeyCode::KeyZ,
          ];

          const DECKCRAFT_DIGITS: [KeyCode; 10] = [
              KeyCode::Digit1, KeyCode::Digit2, KeyCode::Digit3, KeyCode::Digit4, KeyCode::Digit5,
              KeyCode::Digit6, KeyCode::Digit7, KeyCode::Digit8, KeyCode::Digit9, KeyCode::Digit0,
          ];

          const DECKCRAFT_FKEYS: [(KeyCode, NamedKey); 12] = [
              (KeyCode::F1, NamedKey::F1), (KeyCode::F2, NamedKey::F2), (KeyCode::F3, NamedKey::F3),
              (KeyCode::F4, NamedKey::F4), (KeyCode::F5, NamedKey::F5), (KeyCode::F6, NamedKey::F6),
              (KeyCode::F7, NamedKey::F7), (KeyCode::F8, NamedKey::F8), (KeyCode::F9, NamedKey::F9),
              (KeyCode::F10, NamedKey::F10), (KeyCode::F11, NamedKey::F11), (KeyCode::F12, NamedKey::F12),
          ];

          fn deckcraft_hid_key(hid: isize) -> Option<(KeyCode, Option<NamedKey>)> {
              Some(match hid {
                  4..=29 => (DECKCRAFT_LETTERS[(hid - 4) as usize], None),
                  30..=39 => (DECKCRAFT_DIGITS[(hid - 30) as usize], None),
                  40 => (KeyCode::Enter, Some(NamedKey::Enter)),
                  41 => (KeyCode::Escape, Some(NamedKey::Escape)),
                  42 => (KeyCode::Backspace, Some(NamedKey::Backspace)),
                  43 => (KeyCode::Tab, Some(NamedKey::Tab)),
                  44 => (KeyCode::Space, Some(NamedKey::Space)),
                  45 => (KeyCode::Minus, None),
                  46 => (KeyCode::Equal, None),
                  47 => (KeyCode::BracketLeft, None),
                  48 => (KeyCode::BracketRight, None),
                  49 => (KeyCode::Backslash, None),
                  51 => (KeyCode::Semicolon, None),
                  52 => (KeyCode::Quote, None),
                  53 => (KeyCode::Backquote, None),
                  54 => (KeyCode::Comma, None),
                  55 => (KeyCode::Period, None),
                  56 => (KeyCode::Slash, None),
                  58..=69 => {
                      let (code, named) = DECKCRAFT_FKEYS[(hid - 58) as usize];
                      (code, Some(named))
                  }
                  73 => (KeyCode::Insert, Some(NamedKey::Insert)),
                  74 => (KeyCode::Home, Some(NamedKey::Home)),
                  75 => (KeyCode::PageUp, Some(NamedKey::PageUp)),
                  76 => (KeyCode::Delete, Some(NamedKey::Delete)),
                  77 => (KeyCode::End, Some(NamedKey::End)),
                  78 => (KeyCode::PageDown, Some(NamedKey::PageDown)),
                  79 => (KeyCode::ArrowRight, Some(NamedKey::ArrowRight)),
                  80 => (KeyCode::ArrowLeft, Some(NamedKey::ArrowLeft)),
                  81 => (KeyCode::ArrowDown, Some(NamedKey::ArrowDown)),
                  82 => (KeyCode::ArrowUp, Some(NamedKey::ArrowUp)),
                  88 => (KeyCode::NumpadEnter, Some(NamedKey::Enter)),
                  _ => return None,
              })
          }

          fn deckcraft_hid_char(hid: isize) -> String {
              match hid {
                  4..=29 => ((b'a' + (hid - 4) as u8) as char).to_string(),
                  30..=38 => ((b'1' + (hid - 30) as u8) as char).to_string(),
                  39 => "0".to_string(),
                  _ => String::new(),
              }
          }

          // Turns hardware keyboard presses into winit events. Returns true when a key was
          // handled here (so UIKit should not process it again).
          // Only the Command key counts as the shortcut key (reported to egui as Control).
          fn deckcraft_hardware_keys(view: &WinitView, presses: &objc2::runtime::AnyObject, began: bool) -> bool {
              use objc2::runtime::AnyObject;
              let window = match view.window() {
                  Some(window) => window,
                  None => return false,
              };
              let window_id = RootWindowId(window.id());
              let mtm = MainThreadMarker::new().unwrap();
              let mut events: Vec<EventWrapper> = Vec::new();
              let mut consumed = false;

              let all: *mut AnyObject = unsafe { objc2::msg_send![presses, allObjects] };
              if all.is_null() {
                  return false;
              }
              let count: usize = unsafe { objc2::msg_send![all, count] };
              for i in 0..count {
                  let press: *mut AnyObject = unsafe { objc2::msg_send![all, objectAtIndex: i] };
                  if press.is_null() {
                      continue;
                  }
                  let key: *mut AnyObject = unsafe { objc2::msg_send![press, key] };
                  if key.is_null() {
                      continue;
                  }
                  let hid: isize = unsafe { objc2::msg_send![key, keyCode] };
                  let flags: isize = unsafe { objc2::msg_send![key, modifierFlags] };
                  let chars_obj: *mut AnyObject = unsafe { objc2::msg_send![key, charactersIgnoringModifiers] };
                  let chars: String = if chars_obj.is_null() {
                      String::new()
                  } else {
                      let utf8: *const std::os::raw::c_char = unsafe { objc2::msg_send![chars_obj, UTF8String] };
                      if utf8.is_null() {
                          String::new()
                      } else {
                          unsafe { std::ffi::CStr::from_ptr(utf8) }.to_string_lossy().into_owned()
                      }
                  };

                  let mut cmd = flags & 0x100000 != 0;
                  let mut alt = flags & 0x80000 != 0;
                  let mut shift = flags & 0x20000 != 0;
                  let is_modifier = (224..=231).contains(&hid);
                  if is_modifier {
                      match hid {
                          225 | 229 => shift = began,
                          226 | 230 => alt = began,
                          227 | 231 => cmd = began,
                          _ => {}
                      }
                  }

                  let mut mods = crate::keyboard::ModifiersState::default();
                  if shift {
                      mods |= crate::keyboard::ModifiersState::SHIFT;
                  }
                  if alt {
                      mods |= crate::keyboard::ModifiersState::ALT;
                  }
                  if cmd {
                      mods |= crate::keyboard::ModifiersState::CONTROL;
                  }
                  events.push(EventWrapper::StaticEvent(Event::WindowEvent {
                      window_id,
                      event: WindowEvent::ModifiersChanged(crate::event::Modifiers::from(mods)),
                  }));

                  if began && !is_modifier {
                      if let Some((code, named)) = deckcraft_hid_key(hid) {
                          // Backspace and Space are left to UIKit (typing already works) unless Command
                          // is held. Enter, Tab, arrows, Escape, F-keys, Home/End etc. are always handled here.
                          let special = named.is_some() && !matches!(hid, 42 | 44);
                          if special || cmd {
                              let logical_key: Option<Key> = match named {
                                  Some(n) => Some(Key::Named(n)),
                                  None => {
                                      let text = if chars.is_empty() {
                                          deckcraft_hid_char(hid)
                                      } else {
                                          chars.to_lowercase()
                                      };
                                      if text.is_empty() {
                                          None
                                      } else {
                                          Some(Key::Character(smol_str::SmolStr::new(text)))
                                      }
                                  }
                              };
                              if let Some(logical_key) = logical_key {
                                  for state in [ElementState::Pressed, ElementState::Released] {
                                      events.push(EventWrapper::StaticEvent(Event::WindowEvent {
                                          window_id,
                                          event: WindowEvent::KeyboardInput {
                                              device_id: DEVICE_ID,
                                              event: KeyEvent {
                                                  state,
                                                  logical_key: logical_key.clone(),
                                                  physical_key: PhysicalKey::Code(code),
                                                  platform_specific: KeyEventExtra {},
                                                  repeat: false,
                                                  location: KeyLocation::Standard,
                                                  text: None,
                                              },
                                              is_synthetic: false,
                                          },
                                      }));
                                  }
                                  consumed = true;
                              }
                          }
                      }
                  }
              }

              if !events.is_empty() {
                  app_state::handle_nonuser_events(mtm, events);
              }
              consumed
          }
          EOF

          # piece 5: helper functions for right-click, added at the end of view.rs
          cat > "$HOME/rc_helper.rs" <<'EOF'

          // DECKCRAFT-RC-HELPER
          static DECKCRAFT_RC_ATTACHED: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);

          // Listens for the secondary mouse button (or two-finger trackpad click).
          fn deckcraft_attach_right_click(view: &WinitView) {
              use objc2::runtime::AnyObject;
              if DECKCRAFT_RC_ATTACHED.swap(true, std::sync::atomic::Ordering::SeqCst) {
                  return;
              }
              unsafe {
                  let alloc: *mut AnyObject = objc2::msg_send![objc2::class!(UITapGestureRecognizer), alloc];
                  let rec: *mut AnyObject = objc2::msg_send![alloc, initWithTarget: view, action: objc2::sel!(deckcraftRightClick:)];
                  if rec.is_null() {
                      return;
                  }
                  let ok: bool = objc2::msg_send![rec, respondsToSelector: objc2::sel!(setButtonMaskRequired:)];
                  if !ok {
                      return;
                  }
                  let _: () = objc2::msg_send![rec, setButtonMaskRequired: 2usize];
                  let number: *mut AnyObject = objc2::msg_send![objc2::class!(NSNumber), numberWithInteger: 3isize];
                  let types: *mut AnyObject = objc2::msg_send![objc2::class!(NSArray), arrayWithObject: number];
                  let _: () = objc2::msg_send![rec, setAllowedTouchTypes: types];
                  let _: () = objc2::msg_send![view, addGestureRecognizer: rec];
              }
          }

          fn deckcraft_send_right_click(view: &WinitView, recognizer: &UIGestureRecognizer) {
              let window = match view.window() {
                  Some(window) => window,
                  None => return,
              };
              let window_id = RootWindowId(window.id());
              let mtm = MainThreadMarker::new().unwrap();
              let point: CGPoint = unsafe { objc2::msg_send![recognizer, locationInView: view] };
              let scale = view.contentScaleFactor() as f64;
              let position = crate::dpi::PhysicalPosition::new(point.x as f64 * scale, point.y as f64 * scale);
              let mut events: Vec<EventWrapper> = Vec::new();
              events.push(EventWrapper::StaticEvent(Event::WindowEvent {
                  window_id,
                  event: WindowEvent::CursorMoved { device_id: DEVICE_ID, position },
              }));
              for state in [ElementState::Pressed, ElementState::Released] {
                  events.push(EventWrapper::StaticEvent(Event::WindowEvent {
                      window_id,
                      event: WindowEvent::MouseInput {
                          device_id: DEVICE_ID,
                          state,
                          button: crate::event::MouseButton::Right,
                      },
                  }));
              }
              app_state::handle_nonuser_events(mtm, events);
          }
          EOF

      - name: Build for iPad (drops any patch that fails to compile, then retries)
        run: |
          set -o pipefail
          V="$WINIT_VIEW"
          RC=1; PK=1; KB=1; OK=0; HAVE_RC=0

          apply_winit() {
            cp "$V.orig" "$V"
            HAVE_RC=0
            if [ "$KB" = "1" ]; then
              cat "$HOME/kbd_open.rs" > "$HOME/kbd_methods.rs"
              if ! grep -q "didMoveToWindow" "$V"; then
                cat "$HOME/kbd_didmove.rs" >> "$HOME/kbd_methods.rs"
              fi
              if [ "$RC" = "1" ] && ! grep -q "willMoveToWindow" "$V"; then
                cat "$HOME/rc_methods.rs" >> "$HOME/kbd_methods.rs"
                HAVE_RC=1
              fi
              printf '    }\n\n' >> "$HOME/kbd_methods.rs"
              perl -0pi -e 'BEGIN { open(my $fh, "<", "$ENV{HOME}/kbd_methods.rs") or die; local $/; $ins = <$fh>; close $fh; } s/(\n[ \t]*unsafe impl UIKeyInput for WinitView \{)/\n$ins$1/' "$V"
              cat "$HOME/kbd_helper.rs" >> "$V"
              if [ "$HAVE_RC" = "1" ]; then
                cat "$HOME/rc_helper.rs" >> "$V"
              fi
              grep -n "DECKCRAFT-" "$V" || echo "WARNING: patch markers not found"
            fi
          }

          for attempt in 1 2 3 4; do
            echo "=== attempt $attempt: keyboard=$KB right-click=$RC file-picker=$PK ==="
            apply_winit
            if [ "$PK" = "1" ]; then STUB="$HOME/rfd-picker"; else STUB="$HOME/rfd-simple"; fi
            LOG="$HOME/build-$attempt.log"
            if cargo build --release --target aarch64-apple-ios -p deckcraft --config "patch.crates-io.rfd.path='$STUB'" 2>&1 | tee "$LOG"; then
              OK=1
              break
            fi
            echo "=============== COMPILE ERRORS, attempt $attempt (send me these if the final build fails) ==============="
            grep -A14 -E "^error" "$LOG" | head -100 || true
            echo "================================================================================================="
            CHANGED=0
            if [ "$PK" = "1" ] && grep -q 'could not compile `rfd`' "$LOG"; then
              PK=0; CHANGED=1
            fi
            if grep -q 'could not compile `winit`' "$LOG"; then
              if [ "$RC" = "1" ]; then
                RC=0; CHANGED=1
              elif [ "$KB" = "1" ]; then
                KB=0; CHANGED=1
              fi
            fi
            if [ "$CHANGED" = "0" ]; then
              if [ "$PK" = "1" ]; then
                PK=0; CHANGED=1
              elif [ "$RC" = "1" ]; then
                RC=0; CHANGED=1
              elif [ "$KB" = "1" ]; then
                KB=0; CHANGED=1
              fi
            fi
            if [ "$CHANGED" = "0" ]; then
              break
            fi
          done

          echo "success=$OK keyboard-patch=$KB right-click-requested=$RC right-click-code-included=$HAVE_RC file-picker=$PK" | tee "$HOME/final.txt"
          if [ "$OK" != "1" ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "=============== WHAT IS IN THIS IPA ==============="
          cat "$HOME/final.txt" || echo "build did not finish"
          echo "file-picker=1 means the Files app picker is included, 0 means the simple Documents-folder version"
          echo "keyboard-patch=1 means hardware keyboard support is included"
          echo "right-click-code-included=1 means right-click support is included"
          echo "==================================================="

      - name: Diagnostics for the next round
        if: always()
        continue-on-error: true
        run: |
          echo "=== where DeckCraft calls the file dialogs ==="
          grep -rn -B3 -A12 -E "pick_file|pick_files|save_file|pick_folder" apps crates --include=*.rs | grep -v -E "tests?\.rs|_tests\.rs" | head -250
          echo "=== winit view.rs: first responder and keyboard focus ==="
          grep -n -E "FirstResponder|didMoveToWindow|willMoveToWindow" "$WINIT_VIEW" | head -30

      - name: List build output
        run: ls -la target/aarch64-apple-ios/release/

      - name: Package into an IPA
        run: |
          mkdir -p Payload/DeckCraft.app
          cp target/aarch64-apple-ios/release/deckcraft Payload/DeckCraft.app/DeckCraft
          chmod +x Payload/DeckCraft.app/DeckCraft
          cat > Payload/DeckCraft.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>DeckCraft</string>
            <key>CFBundleIdentifier</key><string>com.deckcraftios.personal</string>
            <key>CFBundleName</key><string>DeckCraft</string>
            <key>CFBundleDisplayName</key><string>DeckCraft</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>4</string>
            <key>CFBundleShortVersionString</key><string>0.4</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UIStatusBarHidden</key><true/>
            <key>UIViewControllerBasedStatusBarAppearance</key><false/>
            <key>UIApplicationSupportsIndirectInputEvents</key><true/>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
            </array>
          </dict>
          </plist>
          EOF
          zip -r DeckCraft-unsigned.ipa Payload

      - name: Save the IPA so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: DeckCraft-ipa
          path: DeckCraft-unsigned.ipa
